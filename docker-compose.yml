services:

  postgres:
    image: postgis/postgis:16-3.4
    container_name: nyc_collision_postgres

    environment:
      POSTGRES_DB: nyc_collisions
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: